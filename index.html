<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>عيادة د. شعبان | نظام إدارة العيادة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        :root{
            --ink:#0f2027;
            --primary:#0d9488;
            --primary-dark:#0f766e;
            --accent:#c8963e;
            --surface:#f6f4ef;
            --card-border:#e8e3d8;
        }
        *{ -webkit-tap-highlight-color: transparent; }
        html{ scroll-behavior:smooth; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--surface); }

        ::-webkit-scrollbar{ width:8px; height:8px; }
        ::-webkit-scrollbar-track{ background:transparent; }
        ::-webkit-scrollbar-thumb{ background:#d4cfc2; border-radius:99px; }

        button, a, input, select, textarea { transition: all .18s ease; }
        button:active{ transform: scale(0.96); }
        input:focus, select:focus, textarea:focus { outline:none; }

        .fade-in { animation: fadeIn .35s cubic-bezier(.16,1,.3,1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .pop-in { animation: popIn .28s cubic-bezier(.16,1,.3,1); }
        @keyframes popIn { from { opacity:0; transform: scale(.94) translateY(6px);} to { opacity:1; transform: scale(1) translateY(0);} }

        .modal-overlay { background: radial-gradient(circle at 50% 20%, rgba(15,32,39,.75), rgba(6,12,15,.9)); backdrop-filter: blur(6px); }

        .clinic-bg{
            background:
                radial-gradient(1200px 600px at 15% -10%, rgba(13,148,136,.35), transparent 55%),
                radial-gradient(900px 500px at 110% 10%, rgba(200,150,62,.18), transparent 50%),
                linear-gradient(180deg, #0b1a20 0%, #0f2027 55%, #0b171c 100%);
        }

        .role-card{ position:relative; overflow:hidden; }
        .role-card::after{ content:""; position:absolute; inset:0; background:linear-gradient(120deg, rgba(255,255,255,.06), transparent 60%); opacity:0; transition:opacity .25s; }
        .role-card:hover::after{ opacity:1; }

        .section-card{ border-inline-start-width:4px; }

        .spinner{ width:1rem; height:1rem; border-radius:50%; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; animation: spin .65s linear infinite; display:inline-block; }
        @keyframes spin{ to { transform: rotate(360deg); } }

        @keyframes toastIn { from { opacity:0; transform:translateY(16px) scale(.96);} to {opacity:1; transform:translateY(0) scale(1);} }
        @keyframes toastOut { from {opacity:1; transform:translateY(0);} to {opacity:0; transform:translateY(10px); } }
        .toast-in { animation: toastIn .25s cubic-bezier(.16,1,.3,1); }
        .toast-out { animation: toastOut .2s ease-in forwards; }

        .skeleton{ background: linear-gradient(90deg, #eee4 25%, #fff8 37%, #eee4 63%); background-size: 400% 100%; animation: shimmer 1.4s ease-in-out infinite; }
        @keyframes shimmer { 0%{ background-position: 100% 50%; } 100%{ background-position: 0 50%; } }

        @media (prefers-reduced-motion: reduce){
            *{ animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
        }

        @media print {
            body { background-color: white; }
            header, .no-print { display: none !important; }
            .print-container { box-shadow: none !important; border: none !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="text-slate-800">

    <div id="app"></div>
    <div id="toast-root" class="fixed bottom-5 inset-x-0 z-[100] flex flex-col items-center gap-2 pointer-events-none no-print px-4"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDiSHQtRHdektoXR-dZzOChj-kfD7dknsI",
            authDomain: "my-clinic-98b7e.firebaseapp.com",
            projectId: "my-clinic-98b7e",
            storageBucket: "my-clinic-98b7e.firebasestorage.app",
            messagingSenderId: "811746660075",
            appId: "1:811746660075:web:664963c78f9ee769d938ae"
        };
        const appId = 'd-shaban-clinic-app';
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzFXAoSwCvw9JENrbUNhgOGOoQ6qEsSbu7kRBBnbyPOgBe4ORnZEETjuVcUTTY-C2bGCQ/exec";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const state = {
            user: { uid: "local-user" }, connectionError: null, role: null, view: 'roles',
            patients: [], selectedPatient: null, searchQuery: '', editMode: '',
            passwords: {}, authModal: null, settingsModal: false, settingsError: '', settingsSuccess: '',
            passwordsLoaded: false, patientsLoaded: false
        };

        // ---------- Toast helper (non-blocking feedback) ----------
        function showToast(message, type = 'success') {
            const root = document.getElementById('toast-root');
            if (!root) return;
            const styles = {
                success: 'bg-emerald-600',
                error: 'bg-red-600',
                info: 'bg-slate-800'
            };
            const iconMap = {
                success: `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>`,
                error: `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>`,
                info: `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
            };
            const el = document.createElement('div');
            el.className = `pointer-events-auto ${styles[type] || styles.info} text-white text-sm font-bold px-4 py-3 rounded-2xl shadow-2xl toast-in flex items-center gap-2 max-w-[92vw] sm:max-w-sm`;
            el.innerHTML = `${iconMap[type] || iconMap.info}<span>${message}</span>`;
            root.appendChild(el);
            setTimeout(() => { el.classList.add('toast-out'); setTimeout(() => el.remove(), 220); }, 3200);
        }
        window.showToast = showToast;

        const icons = {
            doctor: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>`,
            pharmacist: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>`,
            nurse: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>`,
            physio: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`,
            therapist: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>`,
            file: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`,
            back: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>`,
            download: `<svg class="w-4 h-4 inline-block ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>`,
            edit: `<svg class="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>`,
            lock: `<svg class="w-4 h-4 inline-block ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>`,
            settings: `<svg class="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`,
            print: `<svg class="w-4 h-4 inline-block ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>`,
            camera: `<svg class="w-4 h-4 inline-block ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`,
            trash: `<svg class="w-4 h-4 inline-block ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`,
            search: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"></path></svg>`,
            plus: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4"></path></svg>`,
            phone: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.517l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>`,
            cake: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c1.657 0 3-1.343 3-3S12 0 12 0s-3 1.343-3 3 1.343 5 3 5z"></path></svg>`,
            empty: `<svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m-9 3V7a2 2 0 012-2h3.28a1 1 0 00.948-.684L9.7 3.316A1 1 0 0110.648 2.6h2.704a1 1 0 01.948.716l.472 1a1 1 0 00.948.684H19a2 2 0 012 2v13a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>`
        };

        const roles = {
            doctor: { title: 'الطبيب', color: 'blue', icon: icons.doctor },
            pharmacist: { title: 'الصيدلي', color: 'emerald', icon: icons.pharmacist },
            nurse: { title: 'الممرض', color: 'orange', icon: icons.nurse },
            physio: { title: 'المعالج الفيزيائي', color: 'purple', icon: icons.physio },
            therapist: { title: 'المعالج النفسي', color: 'indigo', icon: icons.therapist }
        };

        const passRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'passwords');
        onSnapshot(passRef, (docSnap) => {
            if(docSnap.exists()){ state.passwords = docSnap.data(); }
            state.passwordsLoaded = true;
            render();
        });

        const patientsRef = collection(db, 'artifacts', appId, 'public', 'data', 'patients');
        onSnapshot(patientsRef, (snapshot) => {
            const patientsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            patientsData.sort((a, b) => b.createdAt - a.createdAt);
            state.patients = patientsData;
            state.patientsLoaded = true;
            if (state.selectedPatient) { state.selectedPatient = patientsData.find(p => p.id === state.selectedPatient.id); }
            render();
        });

        window.handleRoleClick = (roleKey) => {
            if (!state.passwords[roleKey]) { state.authModal = { roleKey, mode: 'create', error: '' }; }
            else { state.authModal = { roleKey, mode: 'login', error: '' }; }
            render();
        };

        window.submitRoleAuth = async (e) => {
            e.preventDefault();
            const roleKey = state.authModal.roleKey; const mode = state.authModal.mode;
            if (mode === 'create') {
                const pwd = document.getElementById('role-pwd').value; const rec = document.getElementById('role-rec').value;
                if(!rec) { state.authModal.error = 'الرجاء إدخال كلمة بديلة للاسترجاع.'; render(); return; }
                const newPasswords = { ...state.passwords, [roleKey]: { pwd: pwd, recovery: rec } };
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'passwords'), newPasswords, {merge: true});
                state.role = roleKey; state.authModal = null; state.view = 'list'; render();
            } else if (mode === 'login') {
                const pwd = document.getElementById('role-pwd').value;
                const storedData = state.passwords[roleKey];
                const storedPwd = typeof storedData === 'object' ? storedData.pwd : storedData;
                if (storedPwd === pwd) { state.role = roleKey; state.authModal = null; state.view = 'list'; render(); }
                else { state.authModal.error = 'كلمة السر غير صحيحة!'; render(); }
            } else if (mode === 'recover') {
                const rec = document.getElementById('role-rec-input').value; const newPwd = document.getElementById('role-new-pwd').value;
                const storedData = state.passwords[roleKey];
                if (typeof storedData !== 'object' || !storedData.recovery) { state.authModal.error = 'لم يتم تعيين كلمة استرجاع مسبقاً.'; render(); return; }
                if (storedData.recovery === rec) {
                    const newPasswords = { ...state.passwords, [roleKey]: { pwd: newPwd, recovery: storedData.recovery } };
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'passwords'), newPasswords, {merge: true});
                    state.role = roleKey; state.authModal = null; state.view = 'list'; render();
                } else { state.authModal.error = 'الكلمة البديلة غير صحيحة!'; render(); }
            }
        };

        window.forgotPassword = () => { if(state.authModal) { state.authModal.mode = 'recover'; state.authModal.error = ''; render(); } };
        window.openSettings = () => { state.settingsModal = true; state.settingsError = ''; state.settingsSuccess = ''; render(); };
        window.closeSettings = () => { state.settingsModal = false; render(); };
        window.closeAuthModal = () => { state.authModal = null; render(); };
        window.goBack = () => { state.view = 'list'; state.selectedPatient = null; state.editMode = ''; render(); };
        window.openPatient = (id) => { state.selectedPatient = state.patients.find(p => p.id === id); state.view = 'detail'; state.editMode = ''; render(); };
        window.openNewPatient = () => { state.view = 'new'; render(); };
        window.setSearch = (val) => { state.searchQuery = val.toLowerCase(); render(); };
        window.enableEdit = (section) => { state.editMode = section; render(); };
        window.cancelEdit = () => { state.editMode = ''; render(); };
        window.goToRoles = () => { state.role = null; state.view = 'roles'; render(); };

        window.printPatientFile = () => { window.print(); };

        window.capturePatientImage = () => {
            const container = document.getElementById('printable-patient-card');
            if(!container) return;
            showToast('جاري إنشاء الصورة...', 'info');
            html2canvas(container, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `تقرير_المريض_${state.selectedPatient?.basicInfo?.name || 'ملف'}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('تم تحميل الصورة بنجاح', 'success');
            });
        };

        window.deletePatient = async () => {
            if (state.role !== 'doctor' || !state.selectedPatient) return;
            const reason = prompt("الرجاء إدخال سبب حذف/أرشفة ملف المريض (إلزامي):");
            if (!reason || reason.trim() === "") {
                showToast("يجب كتابة سبب الحذف لتتم العملية.", 'error');
                return;
            }

            const patientRef = doc(db, 'artifacts', appId, 'public', 'data', 'patients', state.selectedPatient.id);
            const dateString = new Date().toLocaleString('ar-EG');

            try {
                await updateDoc(patientRef, {
                    isDeleted: true,
                    deleteReason: reason.trim(),
                    deletedAt: dateString,
                    deletedBy: 'الطبيب'
                });
                showToast("تم أرشفة وحذف ملف المريض بنجاح.", 'success');
                goBack();
            } catch (error) {
                showToast("حدث خطأ أثناء عملية الحذف.", 'error');
            }
        };

        window.saveSettings = async (e) => {
            e.preventDefault();
            const roleKey = state.role;
            const btn = document.getElementById('btn-save-settings');
            const currentPwd = document.getElementById('set-curr-pwd').value; const newPwd = document.getElementById('set-new-pwd').value; const newRec = document.getElementById('set-new-rec').value;
            const storedData = state.passwords[roleKey] || {}; const storedPwd = typeof storedData === 'object' ? storedData.pwd : storedData;

            if (currentPwd !== storedPwd) { state.settingsError = 'كلمة السر الحالية غير صحيحة.'; state.settingsSuccess = ''; render(); return; }

            const updatedPwd = newPwd || storedPwd; const updatedRec = newRec || (typeof storedData === 'object' ? storedData.recovery : '');
            const newPasswords = { ...state.passwords, [roleKey]: { pwd: updatedPwd, recovery: updatedRec } };

            if (btn) { btn.innerHTML = '<span class="spinner"></span> جاري الحفظ...'; btn.disabled = true; }

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'passwords'), newPasswords, {merge: true});
                state.settingsSuccess = 'تم حفظ الإعدادات بنجاح!'; state.settingsError = '';
                setTimeout(() => { closeSettings(); }, 1300);
            } catch (error) { state.settingsError = 'حدث خطأ أثناء الحفظ.'; }
            render();
        };

        window.addSection = async (sectionKey) => {
            if (!sectionKey || state.role !== 'doctor' || !state.selectedPatient) return;
            const patientRef = doc(db, 'artifacts', appId, 'public', 'data', 'patients', state.selectedPatient.id);
            const currentSections = state.selectedPatient.activeSections || ['pharmacist', 'nurse'];
            if (!currentSections.includes(sectionKey)) {

                    gender: document.getElementById('p-gender').value, phone: document.getElementById('p-phone').value,
                    history: document.getElementById('p-history').value
                },
                doctorSection: {
                    symptoms: document.getElementById('d-symptoms').value, diagnosis: document.getElementById('d-diagnosis').value,

                    lastUpdated: Date.now(), editHistory: []
                },
                pharmacistSection: null, nurseSection: null, physioSection: null, therapistSection: null,
                activeSections: ['pharmacist', 'nurse'], isDeleted: false, createdAt: Date.now(), createdBy: 'web-user'
            };

            try {
                const patientsRef = collection(db, 'artifacts', appId, 'public', 'data', 'patients');

                const gasPayload = {
                    action: 'addPatient',
                    data: {

                        doctorSection: { symptoms: newPatient.doctorSection.symptoms, diagnosis: newPatient.doctorSection.diagnosis, prescription: newPatient.doctorSection.prescription, notes: newPatient.doctorSection.notes }

                };
                fetch(GAS_URL, {

                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(gasPayload)
                });

                showToast('تم حفظ ملف المريض بنجاح', 'success');

                showToast("حدث خطأ أثناء الحفظ", 'error');
                btn.innerHTML = 'إرسال البيانات وحفظ الملف'; btn.disabled = false;
            }

        window.updatePatientData = async (e, sectionName) => {
            e.preventDefault();
            if (!state.selectedPatient) return;

            const patientRef = doc(db, 'artifacts', appId, 'public', 'data', 'patients', state.selectedPatient.id);
            const updateData = {}; const timestamp = Date.now(); const dateString = new Date().toLocaleString('ar-EG');

            const hasExistingData = !!state.selectedPatient[sectionName] || sectionName === 'doctorSection';
            const reasonInput = document.getElementById('edit-reason');
            const editReasonTxt = reasonInput ? reasonInput.value : '';

            // إلزامي فقط إذا كان هناك بيانات سابقة وتم النقر على زر التعديل
            if (hasExistingData && state.editMode === sectionName) {
                if (!editReasonTxt.trim()) {
                    showToast("الرجاء إدخال سبب التعديل (إلزامي).", 'error');
                    return;
                }
            }

            const submitBtn = e.target.querySelector('button[type="submit"]');
            if (submitBtn) { submitBtn.dataset.label = submitBtn.innerHTML; submitBtn.innerHTML = '<span class="spinner"></span> جاري الحفظ...'; submitBtn.disabled = true; }

            if (sectionName === 'doctorSection') {
                const currentHistory = state.selectedPatient.doctorSection?.editHistory || [];
                if (state.editMode === 'doctorSection' && editReasonTxt) {
                    currentHistory.push({ date: dateString, reason: editReasonTxt });
                }

                updateData.basicInfo = {
                    name: document.getElementById('u-name').value,
                    phone: document.getElementById('u-phone').value,
                    age: document.getElementById('u-age').value,
                    gender: document.getElementById('u-gender').value,
                    history: document.getElementById('u-history').value
                };
                updateData.doctorSection = {
                    symptoms: document.getElementById('u-symptoms').value,
                    diagnosis: document.getElementById('u-diagnosis').value,
                    prescription: document.getElementById('u-prescription').value,
                    notes: document.getElementById('u-notes').value,
                    lastUpdated: timestamp,
                    editHistory: currentHistory
                };
            } else if (sectionName === 'pharmacistSection') {
                const currentHistory = state.selectedPatient.pharmacistSection?.editHistory || [];
                if (state.editMode === 'pharmacistSection' && editReasonTxt) {
                    currentHistory.push({ date: dateString, reason: editReasonTxt });
                }

                updateData.pharmacistSection = {
                    dispensedMeds: document.getElementById('u-meds').value,
                    instructions: document.getElementById('u-instructions').value,
                    lastUpdated: timestamp,
                    editHistory: currentHistory
                };
            } else if (sectionName === 'nurseSection') {
                const currentHistory = state.selectedPatient.nurseSection?.editHistory || [];
                if (state.editMode === 'nurseSection' && editReasonTxt) {
                    currentHistory.push({ date: dateString, reason: editReasonTxt });
                }

                updateData.nurseSection = {
                    procedures: document.getElementById('u-procedures').value,
                    vitals: document.getElementById('u-vitals').value,
                    lastUpdated: timestamp,
                    editHistory: currentHistory
                };
            } else if (sectionName === 'physioSection') {
                const currentHistory = state.selectedPatient.physioSection?.editHistory || [];
                if (state.editMode === 'physioSection' && editReasonTxt) {
                    currentHistory.push({ date: dateString, reason: editReasonTxt });
                }

                updateData.physioSection = {
                    plan: document.getElementById('u-plan').value,
                    sessions: document.getElementById('u-sessions').value,
                    lastUpdated: timestamp,
                    editHistory: currentHistory
                };
            } else if (sectionName === 'therapistSection') {
                const currentHistory = state.selectedPatient.therapistSection?.editHistory || [];
                if (state.editMode === 'therapistSection' && editReasonTxt) {
                    currentHistory.push({ date: dateString, reason: editReasonTxt });
                }

                updateData.therapistSection = {
                    evaluation: document.getElementById('u-evaluation').value,
                    recommendations: document.getElementById('u-recommendations').value,
                    lastUpdated: timestamp,
                    editHistory: currentHistory
                };
            }

            try {
                await updateDoc(patientRef, updateData);

                let sectionDataGas = {};
                if (sectionName === 'doctorSection') sectionDataGas = updateData.doctorSection;
                else if (sectionName === 'pharmacistSection') sectionDataGas = updateData.pharmacistSection;
                else if (sectionName === 'nurseSection') sectionDataGas = updateData.nurseSection;
                else if (sectionName === 'physioSection') sectionDataGas = updateData.physioSection;
                else if (sectionName === 'therapistSection') sectionDataGas = updateData.therapistSection;

                fetch(GAS_URL, {
                    method: 'POST', mode: 'no-cors',

                });

                if (submitBtn) { submitBtn.innerHTML = submitBtn.dataset.label; submitBtn.disabled = false; }

        window.exportData = () => {
            const activePatients = state.patients.filter(p => !p.isDeleted);
            const headers = ["تاريخ الإضافة", "اسم المريض", "العمر", "الهاتف", "تاريخ مرضي", "أعراض", "تشخيص", "وصفة", "أدوية مصروفة", "تعليمات صيدلي", "إجراء تمريضي", "علامات حيوية", "خطة علاج فيزيائي", "جلسات فيزيائية", "تقييم نفسي", "توصيات نفسية"];
            const csvData = activePatients.map(p => {
                const date = new Date(p.createdAt).toLocaleDateString('ar-EG');
                return [ date, p.basicInfo?.name || '', p.basicInfo?.age || '', p.basicInfo?.phone || '', p.basicInfo?.history || '', p.doctorSection?.symptoms || '', p.doctorSection?.diagnosis || '', p.doctorSection?.prescription || '', p.pharmacistSection?.dispensedMeds || '', p.pharmacistSection?.instructions || '', p.nurseSection?.procedures || '', p.nurseSection?.vitals || '', p.physioSection?.plan || '', p.physioSection?.sessions || '', p.therapistSection?.evaluation || '', p.therapistSection?.recommendations || ''].map(field => `"${String(field).replace(/"/g, '""')}"`).join(',');
            });
            const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(','), ...csvData].join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri); link.setAttribute("download", `مرضى_د_شعبان.csv`);

                    <h2 class="text-lg font-extrabold text-slate-700 flex items-center gap-2 pb-2 border-b border-slate-100"><span class="bg-slate-100 text-slate-600 p-2 rounded-xl">${icons.file}</span> بيانات المريض الأساسية</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-sm mb-1.5 text-slate-600 font-medium">اسم المريض *</label><input required id="p-name" type="text" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none transition"></div>
                        <div><label class="block text-sm mb-1.5 text-slate-600 font-medium">رقم الهاتف *</label><input required id="p-phone" type="tel" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none transition"></div>
                        <div><label class="block text-sm mb-1.5 text-slate-600 font-medium">العمر *</label><input required id="p-age" type="number" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none transition"></div>
                        <div><label class="block text-sm mb-1.5 text-slate-600 font-medium">الجنس</label><select id="p-gender" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none transition"><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select></div>
                        <div class="md:col-span-2"><label class="block text-sm mb-1.5 text-slate-600 font-medium">تاريخ مرضي (حساسية، أمراض مزمنة)</label><textarea id="p-history" rows="2" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none transition"></textarea></div>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-blue-100 space-y-4">
                    <h3 class="font-extrabold text-blue-800 flex items-center gap-2 pb-2 border-b border-blue-50"><span class="bg-blue-100 text-blue-600 p-2 rounded-xl">${icons.doctor}</span> الفحص الحالي</h3>
                    <div><label class="block text-sm mb-1.5 text-slate-600 font-medium">الأعراض *</label><textarea required id="d-symptoms" rows="2" class="w-full p-3 border border-blue-100 rounded-xl bg-blue-50/40 outline-none focus:ring-4 focus:ring-blue-400/10 focus:border-blue-400 transition"></textarea></div>
                    <div><label class="block text-sm mb-1.5 text-slate-600 font-medium">التشخيص *</label><input required id="d-diagnosis" type="text" class="w-full p-3 border border-blue-100 rounded-xl bg-blue-50/40 outline-none focus:ring-4 focus:ring-blue-400/10 focus:border-blue-400 transition"></div>
                    <div><label class="block text-sm mb-1.5 text-slate-600 font-medium">الوصفة الطبية (ترسل للصيدلي) *</label><textarea required id="d-prescription" rows="3" class="w-full p-3 border border-blue-100 rounded-xl bg-blue-50/40 outline-none focus:ring-4 focus:ring-blue-400/10 focus:border-blue-400 transition"></textarea></div>
                    <div><label class="block text-sm mb-1.5 text-slate-600 font-medium">ملاحظات داخلية</label><input id="d-notes" type="text" class="w-full p-3 border border-blue-100 rounded-xl bg-blue-50/40 outline-none focus:ring-4 focus:ring-blue-400/10 focus:border-blue-400 transition"></div>
                </div>

                <div class="sticky bottom-3 pt-1 no-print">
                    <button id="btn-save-new" type="submit" class="w-full bg-teal-600 text-white font-bold py-3.5 rounded-2xl hover:bg-teal-700 shadow-lg shadow-teal-600/25 flex items-center justify-center gap-2 transition">إرسال البيانات وحفظ الملف</button>
                </div>
            </form>`;
        }

        function renderDetail() {
            const p = state.selectedPatient; if(!p) return '';
            const activeSecs = p.activeSections || ['pharmacist', 'nurse'];
            const availableToAdd = [{ key: 'physio', title: 'العلاج الفيزيائي' }, { key: 'therapist', title: 'العلاج النفسي' }].filter(s => !activeSecs.includes(s.key));

            const renderSection = (config) => {
                const { key, title, color, icon, roleMatch, data, renderForm, renderView } = config;
                const isMyRole = state.role === roleMatch;
                const hasData = !!data;
                const isEditing = state.editMode === key;
                let content = '';

                // يظهر نموذج الإدخال الطبيعي إذا لم تكن البيانات موجودة بعد
                // أو يظهر نموذج التعديل فقط إذا قام صاحب الصلاحية بالضغط على زر "تعديل"
                if (isMyRole && (!hasData || isEditing)) {
                    content = `
                        <form onsubmit="updatePatientData(event, '${key}')" class="space-y-3 mt-3">
                            ${renderForm()}
                            ${isEditing ? `
                            <div class="mt-3 p-3 bg-red-50 border border-red-200 rounded-xl">
                                <label class="block text-sm font-bold text-red-700 mb-1">سبب التعديل (إلزامي ليراه الجميع) *</label>
                                <input required id="edit-reason" type="text" placeholder="مثال: تعديل بناءً على مستجدات الحالة..." class="w-full p-2.5 border border-red-300 rounded-lg focus:ring-4 focus:ring-red-500/10 outline-none bg-white transition">
                            </div>` : ''}
                            <div class="flex gap-2 pt-2">
                                <button type="submit" class="bg-${color}-600 text-white px-4 py-2.5 rounded-xl text-sm flex-1 font-bold shadow-sm hover:bg-${color}-700 transition flex items-center justify-center gap-1.5">${isEditing ? 'حفظ التعديلات' : 'إرسال التقرير'}</button>
                                ${isEditing ? `<button type="button" onclick="cancelEdit()" class="bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm hover:bg-slate-300 transition font-bold">إلغاء</button>` : ''}
                            </div>
                        </form>`;
                } else if (hasData) {
                    content = `<div class="mt-3 space-y-2 text-sm">${renderView()}${data.editHistory && data.editHistory.length > 0 ? `<div class="mt-3 p-2.5 bg-amber-50 border border-amber-200 rounded-xl text-xs"><strong class="text-amber-800 block mb-1">سجل التعديلات السابقة:</strong><ul class="list-disc list-inside text-amber-700 space-y-1">${data.editHistory.map(h => `<li>[${h.date}] ${h.reason}</li>`).join('')}</ul></div>` : ''}</div>`;
                } else {
                    content = `<p class="text-sm text-slate-400 italic mt-3">بانتظار إدخال البيانات من ${title}...</p>`;
                }

                return `<div class="section-card p-4 rounded-2xl shadow-sm border border-${color}-100 border-r-4 border-r-${color}-400 bg-white"><div class="flex justify-between items-center"><h3 class="font-bold text-${color}-800 flex items-center gap-2"><span class="bg-${color}-50 text-${color}-600 p-1.5 rounded-lg">${icon}</span> قسم ${title}</h3>${isMyRole && hasData && !isEditing ? `<button onclick="enableEdit('${key}')" class="text-xs text-${color}-600 bg-${color}-50 px-2.5 py-1.5 rounded-lg hover:bg-${color}-100 font-bold no-print flex items-center gap-1 transition">${icons.edit} تعديل</button>` : ''}</div>${content}</div>`;
            };

            return `
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-4 no-print">
                    <button onclick="goBack()" class="text-slate-500 hover:text-slate-800 flex items-center gap-1.5 font-medium text-sm bg-white/70 hover:bg-white px-3 py-2 rounded-xl transition w-fit">${icons.back} عودة للقائمة</button>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="printPatientFile()" class="bg-slate-800 text-white px-3 py-2 rounded-xl text-sm flex items-center gap-1 shadow-sm hover:bg-slate-700 transition font-medium">${icons.print} طباعة</button>
                        <button onclick="capturePatientImage()" class="bg-teal-600 text-white px-3 py-2 rounded-xl text-sm flex items-center gap-1 shadow-sm hover:bg-teal-700 transition font-medium">${icons.camera} صورة</button>
                        ${state.role === 'doctor' ? `<button onclick="deletePatient()" class="bg-red-600 text-white px-3 py-2 rounded-xl text-sm flex items-center gap-1 shadow-sm hover:bg-red-700 transition font-medium">${icons.trash} حذف المريض</button>` : ''}
                    </div>
                </div>
                <div id="printable-patient-card" class="space-y-3.5 bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 print-container">
                    <div class="border-b pb-4 mb-1 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-2xl bg-teal-100 text-teal-700 flex items-center justify-center font-extrabold text-lg shrink-0">${(p.basicInfo.name || '؟').trim().charAt(0)}</div>
                            <div>
                                <h2 class="text-xl font-extrabold text-slate-800">${p.basicInfo.name}</h2>
                                <p class="text-xs text-slate-400 mt-0.5">تاريخ الملف: ${new Date(p.createdAt).toLocaleDateString('ar-EG')}</p>
                            </div>
                        </div>
                        <div class="text-left hidden print:block"><span class="text-xs font-bold text-teal-700">عيادة د. شعبان</span></div>
                    </div>

                    ${state.role === 'doctor' && state.editMode === 'doctorSection' ? '' : `
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                            <div><span class="text-slate-400 block text-xs">العمر</span><span class="font-medium">${p.basicInfo.age}</span></div>
                            <div><span class="text-slate-400 block text-xs">الجنس</span><span class="font-medium">${p.basicInfo.gender}</span></div>
                            <div><span class="text-slate-400 block text-xs">الهاتف</span><span class="font-medium">${p.basicInfo.phone}</span></div>
                            <div class="col-span-2 md:col-span-4"><span class="text-slate-400 block text-xs">التاريخ المرضي</span><span class="font-medium">${p.basicInfo.history || 'لا يوجد'}</span></div>
                        </div>
                    </div>`}

                    ${p.isDeleted ? `<div class="p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700"><strong>ملاحظة إدارية:</strong> تم حذف/أرشفة هذا الملف بواسطة (${p.deletedBy}) بتاريخ [${p.deletedAt}]. <br><strong>السبب:</strong> ${p.deleteReason}</div>` : ''}

                    ${renderSection({
                        key: 'doctorSection', title: 'الطبيب', color: 'blue', icon: icons.doctor, roleMatch: 'doctor', data: p.doctorSection,
                        renderForm: () => `
                            <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-200 space-y-3 mb-3">
                                <h4 class="font-bold text-blue-900 text-xs tracking-wider">بيانات المريض الأساسية:</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <div><label class="block text-xs mb-1 text-slate-600">اسم المريض *</label><input required id="u-name" type="text" class="w-full p-2 border rounded-lg bg-white" value="${p.basicInfo.name}"></div>
                                    <div><label class="block text-xs mb-1 text-slate-600">رقم الهاتف *</label><input required id="u-phone" type="tel" class="w-full p-2 border rounded-lg bg-white" value="${p.basicInfo.phone}"></div>
                                    <div><label class="block text-xs mb-1 text-slate-600">العمر *</label><input required id="u-age" type="number" class="w-full p-2 border rounded-lg bg-white" value="${p.basicInfo.age}"></div>
                                    <div><label class="block text-xs mb-1 text-slate-600">الجنس</label><select id="u-gender" class="w-full p-2 border rounded-lg bg-white"><option value="ذكر" ${p.basicInfo.gender === 'ذكر' ? 'selected' : ''}>ذكر</option><option value="أنثى" ${p.basicInfo.gender === 'أنثى' ? 'selected' : ''}>أنثى</option></select></div>
                                    <div class="md:col-span-2"><label class="block text-xs mb-1 text-slate-600">تاريخ مرضي</label><textarea id="u-history" rows="2" class="w-full p-2 border rounded-lg bg-white">${p.basicInfo.history || ''}</textarea></div>
                                </div>
                            </div>
                            <h4 class="font-bold text-blue-900 text-xs tracking-wider">تفاصيل الفحص الحالي:</h4>
                            <div><label class="block text-xs mb-1 text-slate-600">الأعراض *</label><textarea required id="u-symptoms" rows="2" class="w-full p-2 border rounded-lg bg-white">${p.doctorSection?.symptoms || ''}</textarea></div>
                            <div><label class="block text-xs mb-1 text-slate-600">التشخيص *</label><input required id="u-diagnosis" type="text" class="w-full p-2 border rounded-lg bg-white" value="${p.doctorSection?.diagnosis || ''}"></div>
                            <div><label class="block text-xs mb-1 text-slate-600">الوصفة الطبية *</label><textarea required id="u-prescription" rows="2" class="w-full p-2 border rounded-lg bg-white">${p.doctorSection?.prescription || ''}</textarea></div>
                            <div><label class="block text-xs mb-1 text-slate-600">ملاحظات داخلية</label><input id="u-notes" type="text" class="w-full p-2 border rounded-lg bg-white" value="${p.doctorSection?.notes || ''}"></div>`,
                        renderView: () => `<p><span class="text-slate-500 block text-xs">الأعراض:</span> <span class="font-medium text-slate-800">${p.doctorSection.symptoms}</span></p><p><span class="text-slate-500 block text-xs">التشخيص:</span> <span class="font-medium text-slate-800">${p.doctorSection.diagnosis}</span></p><p><span class="text-slate-500 block text-xs">الوصفة:</span> <span class="font-medium text-slate-800 whitespace-pre-wrap">${p.doctorSection.prescription}</span></p>${p.doctorSection.notes ? `<p class="mt-1"><span class="text-slate-500 block text-xs">ملاحظات داخلية:</span> <span class="font-medium text-slate-800">${p.doctorSection.notes}</span></p>` : ''}`
                    })}

                    ${activeSecs.includes('pharmacist') ? renderSection({ key: 'pharmacistSection', title: 'الصيدلية', color: 'emerald', icon: icons.pharmacist, roleMatch: 'pharmacist', data: p.pharmacistSection, renderForm: () => `<div><label class="block text-xs mb-1 text-slate-600">الأدوية المصروفة فعلياً *</label><textarea required id="u-meds" rows="2" class="w-full p-2 border border-emerald-200 rounded-lg bg-white">${p.pharmacistSection?.dispensedMeds || p.doctorSection?.prescription || ''}</textarea></div><div><label class="block text-xs mb-1 text-slate-600">إرشادات الاستخدام للمريض</label><textarea id="u-instructions" rows="2" class="w-full p-2 border border-emerald-200 rounded-lg bg-white">${p.pharmacistSection?.instructions || ''}</textarea></div>`, renderView: () => `<p><span class="text-slate-500 block text-xs">الأدوية المصروفة:</span> <span class="font-medium text-slate-800">${p.pharmacistSection.dispensedMeds}</span></p><p><span class="text-slate-500 block text-xs">التعليمات:</span> <span class="font-medium text-slate-800">${p.pharmacistSection.instructions || '-'}</span></p>` }) : ''}

                    ${activeSecs.includes('nurse') ? renderSection({ key: 'nurseSection', title: 'التمريض', color: 'orange', icon: icons.nurse, roleMatch: 'nurse', data: p.nurseSection, renderForm: () => `<div><label class="block text-xs mb-1 text-slate-600">الإجراءات التمريضية *</label><textarea required id="u-procedures" rows="2" class="w-full p-2 border border-orange-200 rounded-lg bg-white">${p.nurseSection?.procedures || ''}</textarea></div><div><label class="block text-xs mb-1 text-slate-600">العلامات الحيوية</label><input id="u-vitals" type="text" class="w-full p-2 border border-orange-200 rounded-lg bg-white" value="${p.nurseSection?.vitals || ''}"></div>`, renderView: () => `<p><span class="text-slate-500 block text-xs">الإجراءات المتخذة:</span> <span class="font-medium text-slate-800">${p.nurseSection.procedures}</span></p><p><span class="text-slate-500 block text-xs">العلامات الحيوية:</span> <span class="font-medium text-slate-800">${p.nurseSection.vitals || '-'}</span></p>` }) : ''}

                    ${activeSecs.includes('physio') ? renderSection({ key: 'physioSection', title: 'العلاج الفيزيائي', color: 'purple', icon: icons.physio, roleMatch: 'physio', data: p.physioSection, renderForm: () => `<div><label class="block text-xs mb-1 text-slate-600">خطة العلاج والتمارين *</label><textarea required id="u-plan" rows="2" class="w-full p-2 border border-purple-200 rounded-lg bg-white">${p.physioSection?.plan || ''}</textarea></div><div><label class="block text-xs mb-1 text-slate-600">عدد الجلسات المقررة / المنفذة</label><input id="u-sessions" type="text" class="w-full p-2 border border-purple-200 rounded-lg bg-white" value="${p.physioSection?.sessions || ''}"></div>`, renderView: () => `<p><span class="text-slate-500 block text-xs">خطة العلاج:</span> <span class="font-medium text-slate-800">${p.physioSection.plan}</span></p><p><span class="text-slate-500 block text-xs">الجلسات:</span> <span class="font-medium text-slate-800">${p.physioSection.sessions || '-'}</span></p>` }) : ''}

                    ${activeSecs.includes('therapist') ? renderSection({ key: 'therapistSection', title: 'العلاج النفسي', color: 'indigo', icon: icons.therapist, roleMatch: 'therapist', data: p.therapistSection, renderForm: () => `<div><label class="block text-xs mb-1 text-slate-600">التقييم النفسي *</label><textarea required id="u-evaluation" rows="2" class="w-full p-2 border border-indigo-200 rounded-lg bg-white">${p.therapistSection?.evaluation || ''}</textarea></div><div><label class="block text-xs mb-1 text-slate-600">التوصيات والجلسات</label><textarea id="u-recommendations" rows="2" class="w-full p-2 border border-indigo-200 rounded-lg bg-white">${p.therapistSection?.recommendations || ''}</textarea></div>`, renderView: () => `<p><span class="text-slate-500 block text-xs">التقييم النفسي:</span> <span class="font-medium text-slate-800">${p.therapistSection.evaluation}</span></p><p><span class="text-slate-500 block text-xs">التوصيات:</span> <span class="font-medium text-slate-800">${p.therapistSection.recommendations || '-'}</span></p>` }) : ''}

                    ${state.role === 'doctor' && availableToAdd.length > 0 ? `<div class="mt-4 p-4 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3 no-print"><span class="text-sm font-bold text-slate-700 flex items-center gap-2"><svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg> تحويل المريض لقسم آخر:</span><div class="flex gap-2 w-full sm:w-auto"><select id="new-section-select" class="flex-1 sm:w-48 p-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 transition"><option value="">-- اختر القسم --</option>${availableToAdd.map(s => `<option value="${s.key}">${s.title}</option>`).join('')}</select><button onclick="addSection(document.getElementById('new-section-select').value)" class="bg-slate-800 text-white px-4 py-2.5 rounded-xl text-sm hover:bg-slate-700 transition shrink-0 font-bold">إضافة القسم</button></div></div>` : ''}
                </div>`;
        }

        function renderSettingsModal() {
            const rKey = state.role; const rColor = roles[rKey].color;
            return `<div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay fade-in"><div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-md text-slate-800 relative pop-in"><div class="flex items-center gap-2.5 mb-4 border-b pb-3.5 border-slate-100"><div class="p-2.5 bg-${rColor}-100 text-${rColor}-600 rounded-xl">${icons.settings}</div><h2 class="text-xl font-extrabold">إعدادات قسم ${roles[rKey].title}</h2></div><form onsubmit="saveSettings(event)" class="space-y-4"><div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-4"><div><label class="block text-xs font-bold text-slate-600 mb-1.5">كلمة السر الحالية (إجباري للتأكيد)</label><input type="password" id="set-curr-pwd" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:border-${rColor}-500 focus:ring-4 focus:ring-${rColor}-500/10 transition" placeholder="تأكيد الهوية..."></div><div class="border-t border-slate-200 pt-3.5"><label class="block text-xs font-bold text-slate-600 mb-1.5">تغيير كلمة السر (اختياري)</label><input type="password" id="set-new-pwd" class="w-full p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:border-${rColor}-500 focus:ring-4 focus:ring-${rColor}-500/10 transition" placeholder="اتركه فارغاً إذا لم ترد تغييره"></div><div><label class="block text-xs font-bold text-slate-600 mb-1.5">تغيير الكلمة البديلة للاسترجاع (اختياري)</label><input type="text" id="set-new-rec" class="w-full p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:border-${rColor}-500 focus:ring-4 focus:ring-${rColor}-500/10 transition" placeholder="اتركه فارغاً إذا لم ترد تغييره"></div></div>${state.settingsError ? `<p class="text-red-500 text-sm text-center font-bold bg-red-50 p-2.5 rounded-xl">${state.settingsError}</p>` : ''}${state.settingsSuccess ? `<p class="text-emerald-600 text-sm text-center font-bold bg-emerald-50 p-2.5 rounded-xl">${state.settingsSuccess}</p>` : ''}<div class="flex gap-2 mt-4 pt-2"><button id="btn-save-settings" type="submit" class="flex-1 bg-${rColor}-600 text-white font-bold py-3 rounded-xl shadow-sm hover:bg-${rColor}-700 transition flex items-center justify-center gap-2">حفظ التغييرات</button><button type="button" onclick="closeSettings()" class="px-4 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 transition font-bold">إغلاق</button></div></form></div></div>`;
        }
    </script>
</body>
</html>
